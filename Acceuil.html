<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJET INNO | Accueil</title>
    
    <!-- Polices Google -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <!-- Icônes FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- 1. CONFIGURATION DES COULEURS --- */
        :root {
            --bordeaux: #580F45;
            --orange: #F48C2E;
            --teal: #2EAF7D;
            --blue: #2A325E;
            --white: #ffffff;
            --bg-light: #F8F9FA;
            --bg-dark: #1A1D2E;
        }

        /* --- 2. BASE DU SITE --- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Open Sans', sans-serif;
            background-color: var(--bg-light); /* Couleur de fond par défaut */
            color: var(--blue);
            transition: all 0.3s ease;
            
            /* Motif de fond appliqué directement au body pour éviter les bugs d'affichage */
            background-image: radial-gradient(rgba(42, 50, 94, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Mode Sombre (Activé via JS) */
        body.dark-mode {
            background-color: var(--bg-dark);
            color: #EAEAEA;
            background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
        }

        a { text-decoration: none; color: inherit; }

        /* --- 3. BARRE DE NAVIGATION --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background: rgba(255, 255, 255, 0.9);
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        body.dark-mode .navbar {
            background: rgba(26, 29, 46, 0.95);
            border-color: #333;
        }

        .logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--bordeaux);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        body.dark-mode .logo { color: white; }
        
        /* Bouton Switch Mode */
        .theme-btn {
            background: none;
            border: 2px solid var(--orange);
            color: var(--orange);
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .theme-btn:hover { background: var(--orange); color: white; }

        /* --- 4. CONTENU PRINCIPAL --- */
        .hero {
            flex: 1; /* Prend toute la hauteur disponible */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 3rem 1rem;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 3.5rem;
            margin: 0 0 1rem 0;
            line-height: 1.1;
            color: var(--bordeaux);
        }
        body.dark-mode h1 { color: white; }
        
        .subtitle {
            font-size: 1.2rem;
            max-width: 600px;
            margin-bottom: 3rem;
            opacity: 0.8;
        }

        /* --- 5. CARTES DE RÔLES --- */
        .cards-container {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 900px;
        }

        .card {
            background: var(--white);
            border: 1px solid #eee;
            border-radius: 15px;
            padding: 2rem;
            width: 300px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.3s;
        }
        body.dark-mode .card {
            background: #232742;
            border-color: #333;
        }

        .card:hover { transform: translateY(-5px); border-color: var(--orange); }

        .icon { font-size: 2.5rem; margin-bottom: 1rem; display: block; }
        .concepteur-icon { color: var(--bordeaux); }
        .user-icon { color: var(--teal); }

        .btn {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .btn-primary { background: var(--bordeaux); color: white; border: none; }
        .btn-outline { background: transparent; border: 2px solid var(--teal); color: var(--teal); }

        /* --- 6. FOOTER --- */
        footer {
            padding: 20px;
            text-align: center;
            font-size: 0.8rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <!-- NAVIGATION -->
    <nav class="navbar">
        <div class="logo">
            <i class="fa-solid fa-atom" style="color: var(--orange);"></i>
            PROJET INNO
        </div>
        <button class="theme-btn" onclick="toggleTheme()">
            <i class="fa-solid fa-moon"></i> Mode Nuit
        </button>
    </nav>

    <!-- ZONE PRINCIPALE -->
    <section class="hero">
        <h1>OSER POUR<br><span style="color: var(--orange);">INNOVER</span></h1>
        <p class="subtitle">Plateforme collaborative d'ingénierie pédagogique et de formation.</p>

        <div class="cards-container">
            <!-- CARTE CONCEPTEUR -->
            <div class="card" onclick="window.location.href='dashboard.html'">
                <i class="fa-solid fa-pen-ruler icon concepteur-icon"></i>
                <h3>Concepteur</h3>
                <p>Gestion de projet, Backstage et Outils.</p>
                <span class="btn btn-primary">Gérer le projet</span>
            </div>

            <!-- CARTE APPRENANT -->
            <div class="card" onclick="alert('Lancement du module apprenant...')">
                <i class="fa-solid fa-rocket icon user-icon"></i>
                <h3>Apprenant</h3>
                <p>Modules interactifs et parcours gamifié.</p>
                <span class="btn btn-outline">Commencer</span>
            </div>
        </div>
    </section>

    <!-- PIED DE PAGE -->
    <footer>
        &copy; 2024 Projet Inno - V 1.0
    </footer>

    <!-- SCRIPT SIMPLE -->
    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const btn = document.querySelector('.theme-btn');
            
            if(document.body.classList.contains('dark-mode')) {
                btn.innerHTML = '<i class="fa-solid fa-sun"></i> Mode Jour';
            } else {
                btn.innerHTML = '<i class="fa-solid fa-moon"></i> Mode Nuit';
            }
        }
    </script>
</body>
</html>
